services:
  - type: web
    name: xiaomi-ewaste-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_USERNAME
        value: demo
      - key: APP_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: true
